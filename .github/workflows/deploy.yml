name: Deploy

# Push to main uploads production. A push to any other branch uploads a
# preview alias. workflow_dispatch deploys the branch you select.
# There is no pull_request trigger, so a fork cannot receive these secrets.
# pull_request_target is not used.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# Jobs opt in below. The secret check does not read the repository.
permissions: {}

concurrency:
  group: pages-deploy-${{ github.workflow }}-${{ github.ref }}
  # A production upload runs to completion. A newer preview may cancel
  # the previous preview of that same ref.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guard:
    name: Check Cloudflare secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Require CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
        id: check
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          absent=""
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            absent="CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            if [ -n "${absent}" ]; then
              absent="${absent} and CLOUDFLARE_ACCOUNT_ID"
            else
              absent="CLOUDFLARE_ACCOUNT_ID"
            fi
          fi
          how="Add each missing name under Settings → Secrets and variables → Actions as a repository secret. Do not commit it and do not add a .env file. CLOUDFLARE_API_TOKEN is an account API token with Cloudflare Pages: Edit on this account. CLOUDFLARE_ACCOUNT_ID is the account id. Secret values are not printed."
          if [ -z "${absent}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Pages secrets are present."
            exit 0
          fi
          if [ "${absent}" = "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID" ]; then
            be="are"
          else
            be="is"
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            printf '%s\n' "::error title=Missing ${absent}::${absent} ${be} not set. Production deploy was not started. ${how}"
            exit 1
          fi
          printf '%s\n' "::notice title=Missing ${absent}::${absent} ${be} not set. Preview deploy was skipped. ${how} A push to main fails until both secrets are set."
          echo "deploy=false" >> "$GITHUB_OUTPUT"

  production:
    name: Deploy production
    needs: guard
    if: >-
      needs.guard.result == 'success' &&
      needs.guard.outputs.deploy == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      # Pages hostname for project sdf-landing. This workflow does not
      # attach softwaredecisionfabric.tech.
      url: https://sdf-landing.pages.dev
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      # actions/checkout v4.4.0. Tags v4 and v4.4.0 both point at this commit
      # (verified 2026-11-07; the tag object type is commit).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0. Tags v4 and v4.4.0 both point at this commit
      # (verified 2026-11-07; the tag object type is commit).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:copy
      - run: npm run check:jsonld
      # actions/checkout leaves HEAD detached. deploy.mjs uploads nothing
      # in that state, and it refuses a dirty main tree.
      - name: Attach HEAD to this branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "${GITHUB_REF_NAME}" HEAD
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ -z "${branch}" ] || [ "${branch}" = "HEAD" ]; then
            printf '%s\n' "::error::Could not check out ${GITHUB_REF_NAME}. npm run deploy does not upload from a detached HEAD."
            exit 1
          fi
      - name: Upload with npm run deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            printf '%s\n' "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set before npm run deploy. Add the missing repository secret under Settings → Secrets and variables → Actions. Values are not printed."
            exit 1
          fi
          # loadRepoEnv() uses these process variables when .env is absent.
          # The GitHub token is not a Cloudflare credential.
          unset GITHUB_TOKEN GH_TOKEN || true
          npm run deploy

  preview:
    name: Deploy preview
    needs: guard
    if: >-
      needs.guard.result == 'success' &&
      needs.guard.outputs.deploy == 'true' &&
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: preview
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      # actions/checkout v4.4.0. Tags v4 and v4.4.0 both point at this commit
      # (verified 2026-11-07; the tag object type is commit).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0. Tags v4 and v4.4.0 both point at this commit
      # (verified 2026-11-07; the tag object type is commit).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:copy
      - run: npm run check:jsonld
      # actions/checkout leaves HEAD detached. deploy.mjs uploads nothing
      # in that state, and it refuses a dirty main tree.
      - name: Attach HEAD to this branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "${GITHUB_REF_NAME}" HEAD
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ -z "${branch}" ] || [ "${branch}" = "HEAD" ]; then
            printf '%s\n' "::error::Could not check out ${GITHUB_REF_NAME}. npm run deploy does not upload from a detached HEAD."
            exit 1
          fi
      - name: Upload with npm run deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            printf '%s\n' "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set before npm run deploy. Add the missing repository secret under Settings → Secrets and variables → Actions. Values are not printed."
            exit 1
          fi
          # loadRepoEnv() uses these process variables when .env is absent.
          # The GitHub token is not a Cloudflare credential.
          unset GITHUB_TOKEN GH_TOKEN || true
          npm run deploy
