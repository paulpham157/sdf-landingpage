name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      # actions/checkout v4.4.0. Tags v4 and v4.4.0 both point at this commit
      # (verified 2026-11-07; the tag object type is commit).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0. Tags v4 and v4.4.0 both point at this commit
      # (verified 2026-11-07; the tag object type is commit).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:deploy
      - run: npm run build
      - run: npm run check:copy
      - run: npm run check:jsonld
